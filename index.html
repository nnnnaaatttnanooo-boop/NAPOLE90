<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة MK980 / AK980 الكمية</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Tahoma, sans-serif; background-color: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; padding: 25px; border-radius: 14px; width: 100%; max-width: 420px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; margin-bottom: 20px; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; font-size: 15px; }
        input { background: #334155; color: #fff; outline: none; border: 1px solid #475569; }
        input:focus { border-color: #38bdf8; }
        button { background: #0ea5e9; color: #fff; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.9; }
        .btn-green { background: #10b981; }
        .btn-orange { background: #f59e0b; }
        .btn-purple { background: #8b5cf6; }
        .btn-red { background: #ef4444; }
        .hidden { display: none !important; }
        .info-box { background: #334155; padding: 12px; border-radius: 8px; margin: 8px 0; text-align: center; }
        .info-box p { margin: 0 0 4px 0; color: #94a3b8; font-size: 13px; }
        .info-box h3 { margin: 0; font-size: 20px; color: #38bdf8; }
        .section-title { font-size: 16px; color: #38bdf8; margin-top: 15px; margin-bottom: 8px; border-bottom: 1px solid #334155; padding-bottom: 4px; }
        .error { color: #f87171; text-align: center; font-size: 13px; margin-top: 5px; }
        .success { color: #34d399; text-align: center; font-size: 13px; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>منصة MK980 الكمية</h2>
        
        <!-- 1. قسم تسجيل الدخول / إنشاء الحساب -->
        <div id="auth-section">
            <input type="email" id="email" placeholder="البريد الإلكتروني">
            <input type="password" id="password" placeholder="كلمة المرور">
            <button type="button" onclick="handleSignUp()">إنشاء حساب جديد</button>
            <button type="button" onclick="handleSignIn()" class="btn-green">تسجيل الدخول</button>
            <p id="auth-error" class="error"></p>
        </div>

        <!-- 2. لوحة تحكم العضو -->
        <div id="dashboard-section" class="hidden">
            <div class="info-box">
                <p>الرصيد الحالي المتاح:</p>
                <h3 id="user-balance">$ 0.00</h3>
            </div>
            <div class="info-box">
                <p>مستوى العضوية:</p>
                <h3 id="user-vip" style="color: #f59e0b;">Normal</h3>
            </div>

            <!-- زر طلب الإيداع -->
            <button type="button" onclick="requestDeposit()" class="btn-orange">طلب إيداع لفتح VIP2</button>
            <p id="deposit-msg"></p>

            <!-- قسم المهام اليومية -->
            <div class="section-title">المهام التداولية اليومية</div>
            <button type="button" onclick="executeTask()" class="btn-purple">تنفيذ مهمة التداول اليومية (+5.00$)</button>
            <p id="task-msg"></p>

            <!-- قسم السحب -->
            <div class="section-title">سحب الأرباح</div>
            <button type="button" onclick="requestWithdrawal()" class="btn-green">طلب سحب الرصيد</button>
            <p id="withdraw-msg"></p>

            <!-- خروج -->
            <button type="button" onclick="handleLogout()" class="btn-red" style="margin-top: 15px;">تسجيل الخروج</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://vgjlqzakjijeuqpyppyc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_r-kNwVlmJh1qfm9Aqut4WA_HaEp9eFk';
        
        let clientSupabase = null;
        try {
            if (window.supabase && typeof window.supabase.createClient === 'function') {
                clientSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch(e) {
            console.log("SupabaseInitError:", e);
        }

        // إنشاء حساب جديد (رصيد 0.00$)
        async function handleSignUp() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errBox = document.getElementById('auth-error');
            errBox.innerText = '';

            if (!email || !password) {
                errBox.innerText = 'يرجى إدخال البريد الإلكتروني وكلمة المرور.';
                return;
            }

            const userAccount = { email, password, balance: 0.00, vip_level: 'Normal' };
            localStorage.setItem('user_' + email, JSON.stringify(userAccount));
            localStorage.setItem('current_user', email);

            if (clientSupabase) {
                try {
                    const { data } = await clientSupabase.auth.signUp({ email, password });
                    if (data?.user) {
                        await clientSupabase.from('profiles').insert([{ id: data.user.id, balance: 0.00, vip_level: 'Normal' }]);
                    }
                } catch (e) {
                    console.log("Cloud sync note:", e);
                }
            }

            alert('تم إنشاء الحساب بنجاح! رصيدك الابتدائي $0.00. تم تسجيل دخولك بنجاح.');
            showDashboard(userAccount);
        }

        // تسجيل الدخول
        async function handleSignIn() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errBox = document.getElementById('auth-error');
            errBox.innerText = '';

            if (!email || !password) {
                errBox.innerText = 'يرجى إدخال البريد وكلمة المرور.';
                return;
            }

            const localData = localStorage.getItem('user_' + email);
            if (localData) {
                const userObj = JSON.parse(localData);
                if (userObj.password === password) {
                    localStorage.setItem('current_user', email);
                    showDashboard(userObj);
                    return;
                }
            }

            if (clientSupabase) {
                const { data, error } = await clientSupabase.auth.signInWithPassword({ email, password });
                if (error) {
                    errBox.innerText = 'خطأ في بيانات الدخول: ' + error.message;
                } else {
                    localStorage.setItem('current_user', email);
                    loadCloudData(data.user.id, email);
                }
            } else {
                errBox.innerText = 'الحساب غير موجود، يرجى الضغط على "إنشاء حساب جديد".';
            }
        }

        function showDashboard(userObj) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('user-balance').innerText = '$ ' + (userObj.balance || 0).toFixed(2);
            document.getElementById('user-vip').innerText = userObj.vip_level || 'Normal';
        }

        async function loadCloudData(userId, email) {
            if (!clientSupabase) return;
            const { data } = await clientSupabase.from('profiles').select('*').eq('id', userId).single();
            if (data) {
                const updated = { email, balance: data.balance, vip_level: data.vip_level };
                localStorage.setItem('user_' + email, JSON.stringify(updated));
                showDashboard(updated);
            }
        }

        // طلب إيداع لفتح VIP2
        async function requestDeposit() {
            const currentUserEmail = localStorage.getItem('current_user');
            if (!currentUserEmail) return;

            const amount = prompt("أدخل مبلغ الإيداع المطلوب لفتح VIP2 (مثلاً 100):");
            const msgBox = document.getElementById('deposit-msg');

            if (!amount || isNaN(amount) || parseFloat(amount) <= 0) return;

            msgBox.className = 'success';
            msgBox.innerText = 'تم إرسال طلب الإيداع بقيمة $' + amount + ' بنجاح! بانتظار موافقة الإدارة لتفعيل VIP2 والرصيد.';

            if (clientSupabase) {
                const { data: { session } } = await clientSupabase.auth.getSession();
                if (session) {
                    await clientSupabase.from('deposits').insert([{ user_id: session.user.id, amount: parseFloat(amount), status: 'pending' }]);
                }
            }
        }

        // تنفيذ مهمة يومية
        function executeTask() {
            const currentUserEmail = localStorage.getItem('current_user');
            if (!currentUserEmail) return;

            const localData = JSON.parse(localStorage.getItem('user_' + currentUserEmail));
            const msgBox = document.getElementById('task-msg');

            if (localData.vip_level !== 'VIP 2') {
                msgBox.className = 'error';
                msgBox.innerText = 'عذراً، يجب تفعيل مستوى VIP 2 أولاً لتنفيذ المهام اليومية.';
                return;
            }

            // إضافة أرباح المهمة
            localData.balance += 5.00;
            localStorage.setItem('user_' + currentUserEmail, JSON.stringify(localData));
            showDashboard(localData);

            msgBox.className = 'success';
            msgBox.innerText = 'تم تنفيذ المهمة اليومية بنجاح وإضافة +5.00$ إلى رصيدك!';
        }

        // طلب سحب الأرباح
        function requestWithdrawal() {
            const currentUserEmail = localStorage.getItem('current_user');
            if (!currentUserEmail) return;

            const localData = JSON.parse(localStorage.getItem('user_' + currentUserEmail));
            const msgBox = document.getElementById('withdraw-msg');

            const amount = prompt("أدخل المبلغ المراد سحبه (الرصيد المتاح: $" + localData.balance.toFixed(2) + "):");
            if (!amount || isNaN(amount) || parseFloat(amount) <= 0) return;

            if (parseFloat(amount) > localData.balance) {
                msgBox.className = 'error';
                msgBox.innerText = 'عذراً، الرصيد غير كافٍ لإجراء عملية السحب.';
                return;
            }

            localData.balance -= parseFloat(amount);
            localStorage.setItem('user_' + currentUserEmail, JSON.stringify(localData));
            showDashboard(localData);

            msgBox.className = 'success';
            msgBox.innerText = 'تم تقديم طلب سحب بقيمة $' + amount + ' بنجاح!';
        }

        function handleLogout() {
            localStorage.removeItem('current_user');
            if (clientSupabase) clientSupabase.auth.signOut();
            location.reload();
        }

        window.onload = function() {
            const loggedEmail = localStorage.getItem('current_user');
            if (loggedEmail) {
                const localData = localStorage.getItem('user_' + loggedEmail);
                if (localData) showDashboard(JSON.parse(localData));
            }
        };
    </script>
</body>
</html>
