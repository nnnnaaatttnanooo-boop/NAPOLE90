<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة NAPOLE90 للتعدين </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- مكتبات Firebase للتحديث الفوري عبر جميع المتصفحات -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-main: #0b0e14;
            --bg-card: #182232;
            --accent: #f0b90b;
            --text-main: #ffffff;
            --text-sec: #848e9c;
            --border: #232d3f;
            --green: #0ecb81;
            --red: #f6465d;
            --blue-verified: #1da1f2;
            --telegram: #0088cc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding-bottom: 70px; }
        
        .main-container { max-width: 480px; margin: 0 auto; padding: 20px; }
        .card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 15px; }
        
        .top-app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 5px 0; }
        .brand-header-top { display: flex; align-items: center; gap: 8px; }
        .brand-logo-container { width: 40px; height: 40px; background: #121824; border: 2px solid var(--accent); border-radius: 50%; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .brand-logo-container img { width: 100%; height: 100%; object-fit: cover; }
        .brand-title { font-size: 1rem; font-weight: bold; color: var(--accent); }
        .brand-subtitle { font-size: 0.6rem; color: var(--text-sec); }

        .user-top-right { display: flex; flex-direction: column; align-items: flex-end; background: #121824; border: 1px solid var(--border); padding: 6px 12px; border-radius: 12px; }
        .user-profile-row { display: flex; align-items: center; gap: 6px; }
        .user-name-tag { font-size: 0.8rem; font-weight: bold; color: #fff; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .verified-icon { color: var(--blue-verified); font-size: 0.85rem; }
        
        .user-actions-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
        .mini-action-btn { background: #232d3f; border: none; color: var(--text-sec); font-size: 0.65rem; padding: 2px 6px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .mini-action-btn:hover { background: var(--accent); color: #000; }

        .financial-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 15px; }
        .stat-box { background: #121824; border: 1px solid var(--border); border-radius: 12px; padding: 15px; text-align: right; position: relative; }
        .stat-box::after { content: ''; position: absolute; top: 0; right: 0; width: 3px; height: 100%; background: var(--accent); }
        .stat-box.green-accent::after { background: var(--green); }
        .stat-box.blue-accent::after { background: var(--blue-verified); }
        .stat-box.red-accent::after { background: var(--red); }
        
        .stat-title { font-size: 0.75rem; color: var(--text-sec); margin-bottom: 5px; display: flex; align-items: center; justify-content: space-between; }
        .stat-value { font-size: 1.25rem; font-weight: bold; color: #fff; }

        .mid-buttons-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .btn-mid { padding: 10px 5px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; cursor: pointer; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .btn-deposit-action { background: #123524; color: var(--green); border-color: rgba(14, 203, 129, 0.3); }
        .btn-withdraw-action { background: #351218; color: var(--red); border-color: rgba(246, 70, 93, 0.3); }
        .btn-details-action { background: #122135; color: var(--blue-verified); border-color: rgba(29, 161, 242, 0.3); }

        .network-option-card { background: #121824; border: 1px solid var(--border); border-radius: 10px; padding: 12px 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-sec); font-size: 0.85rem; }
        .form-control { width: 100%; padding: 12px; background: #121824; border: 1px solid var(--border); border-radius: 8px; color: #fff; outline: none; font-size: 0.9rem; direction: ltr; text-align: left; }
        
        .btn { padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .btn-primary { background-color: var(--accent); color: #000; }
        .btn-success { background-color: var(--green); color: #fff; }
        .btn-danger { background-color: var(--red); color: #fff; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background-color: var(--bg-card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 999; }
        .nav-item { text-align: center; color: var(--text-sec); cursor: pointer; font-size: 0.7rem; background: none; border: none; }
        .nav-item.active { color: var(--accent); }
        .nav-item i { display: block; font-size: 1.1rem; margin-bottom: 2px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { width: 100%; max-width: 400px; }
        .hidden { display: none !important; }
        .text-accent { color: var(--accent); }
        .text-success { color: var(--green); }
        .text-danger { color: var(--red); }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- شاشة تسجيل الدخول -->
        <div id="authScreen" class="card" style="margin-top: 20px;">
            <div style="text-align: center; margin-bottom: 20px;">
                <h2 style="color: var(--accent);"> NAPOLE90</h2>
            </div>
            <div id="loginForm">
                <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="loginEmail" class="form-control" placeholder="name@example.com"></div>
                <div class="form-group"><label>كلمة المرور</label><input type="password" id="loginPassword" class="form-control" placeholder="******"></div>
                <button class="btn btn-primary" onclick="login()">دخول</button>
            </div>
        </div>

        <!-- واجهة المنصة الرئيسية -->
        <div id="appScreen" class="hidden">
            <div class="top-app-header">
                <div class="brand-header-top">
                    <div class="brand-title">NAPOLE90</div>
                </div>
                <div class="user-top-right">
                    <div class="user-profile-row">
                        <div class="user-name-tag" id="userDisplayEmail">user@mail.com</div>
                    </div>
                    <div class="user-actions-row">
                        <button class="mini-action-btn" id="adminControlBtn" onclick="openAdminPanel()" style="display: none; background: var(--accent); color: #000; font-weight: bold;">
                            <i class="fas fa-user-shield"></i> لوحة الأدمن
                        </button>
                    </div>
                </div>
            </div>

            <div class="card" style="padding: 15px;">
                <div class="financial-grid">
                    <div class="stat-box">
                        <div class="stat-title">إجمالي الأصول</div>
                        <div class="stat-value" id="totalAssets">0.00</div>
                    </div>
                    <div class="stat-box green-accent">
                        <div class="stat-title">حساب التعدين</div>
                        <div class="stat-value" id="quantAccount">0.00</div>
                    </div>
                </div>

                <div class="mid-buttons-container">
                    <button class="btn-mid btn-deposit-action" onclick="openModal('depositAddressModal')">
                        <i class="fas fa-wallet"></i> إيداع
                    </button>
                    <button class="btn-mid btn-withdraw-action" onclick="openModal('withdrawFormModal')">
                        <i class="fas fa-money-bill-transfer"></i> سحب
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة لوحة تحكم الأدمن البث المباشر -->
    <div id="adminPanelModal" class="modal-overlay">
        <div class="modal-content card" style="max-width: 450px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                <h4 class="text-accent"><i class="fas fa-user-shield"></i> لوحة التحكم الإدارية (تحديث حي)</h4>
                <i class="fas fa-times" style="cursor: pointer; color: var(--text-sec)" onclick="closeModal('adminPanelModal')"></i>
            </div>
            
            <p style="font-size: 0.75rem; color: var(--text-sec); margin-bottom: 5px;">طلبات الإيداع المعلقة:</p>
            <div id="adminDepositsList" style="max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px;"></div>

            <p style="font-size: 0.75rem; color: var(--text-sec); margin-bottom: 5px;">طلبات السحب المعلقة:</p>
            <div id="adminWithdrawalsList" style="max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;"></div>
        </div>
    </div>

    <!-- نافذة الإيداع -->
    <div id="depositAddressModal" class="modal-overlay">
        <div class="modal-content card">
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                <h4>إيداع USDT</h4>
                <i class="fas fa-times" style="cursor: pointer;" onclick="closeModal('depositAddressModal')"></i>
            </div>
            <div class="form-group">
                <label>أدخل مبلغ الإيداع (USDT)</label>
                <input type="number" id="depositAmount" class="form-control" placeholder="مثال: 50">
            </div>
            <button class="btn btn-success" onclick="submitDeposit()">إرسال طلب الإيداع</button>
        </div>
    </div>

    <!-- نافذة السحب -->
    <div id="withdrawFormModal" class="modal-overlay">
        <div class="modal-content card">
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                <h4>طلب سحب</h4>
                <i class="fas fa-times" style="cursor: pointer;" onclick="closeModal('withdrawFormModal')"></i>
            </div>
            <div class="form-group">
                <label>عنوان المحفظة</label>
                <input type="text" id="userWalletAddressInput" class="form-control" placeholder="أدخل محفظتك">
            </div>
            <div class="form-group">
                <label>المبلغ (USDT)</label>
                <input type="number" id="withdrawAmount" class="form-control" placeholder="مثال: 20">
            </div>
            <button class="btn btn-danger" onclick="submitWithdraw()">تقديم طلب السحب</button>
        </div>
    </div>

    <script>
        // --- 1. إعدادات قاعدة بيانات FIREBASE (لعمل الربط بين المتصفحات) ---
        const firebaseConfig = {
            databaseURL: "https://napole90-mining-default-rtdb.firebaseio.com/" // رابط السيرفر المباشر
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const ADMIN_EMAIL = 'nnnnaaatttnanooo@gmail.com';
        let currentUserEmail = localStorage.getItem('quant_current_user') || null;

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function login() {
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            if (email) {
                currentUserEmail = email;
                localStorage.setItem('quant_current_user', email);
                showAppScreen();
            }
        }

        function showAppScreen() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');
            document.getElementById('userDisplayEmail').innerText = currentUserEmail;

            if (currentUserEmail === ADMIN_EMAIL) {
                document.getElementById('adminControlBtn').style.display = 'inline-flex';
                listenToLiveAdminRequests(); // تفعيل الاستماع اللحظي للطلبات
            }

            // الاستماع لرصيد المستخدم المباشر
            db.ref('users/' + cleanEmail(currentUserEmail)).on('value', snapshot => {
                const data = snapshot.val() || { balance: 0 };
                document.getElementById('totalAssets').innerText = (data.balance || 0).toFixed(2) + " USDT";
                document.getElementById('quantAccount').innerText = (data.balance || 0).toFixed(2) + " USDT";
            });
        }

        // تحويل الإيميل لمفتاح مقبول في Firebase
        function cleanEmail(email) { return email.replace(/\./g, '_'); }

        // --- 2. إرسال الإيداع والسحب إلى السيرفر ليظهر لدى الأدمن فوراً ---
        function submitDeposit() {
            const amount = parseFloat(document.getElementById('depositAmount').value);
            if (!amount || amount <= 0) return alert('أدخل مبلغ صحيح');

            const newReqRef = db.ref('pending_deposits').push();
            newReqRef.set({
                id: newReqRef.key,
                email: currentUserEmail,
                amount: amount,
                timestamp: Date.now()
            });

            closeModal('depositAddressModal');
            document.getElementById('depositAmount').value = '';
            alert('تم إرسال طلب الإيداع! يظهر الآن للأدمن للموافقة عليه.');
        }

        function submitWithdraw() {
            const wallet = document.getElementById('userWalletAddressInput').value.trim();
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            if (!wallet || !amount) return alert('يرجى ملء البيانات');

            const newReqRef = db.ref('pending_withdrawals').push();
            newReqRef.set({
                id: newReqRef.key,
                email: currentUserEmail,
                amount: amount,
                wallet: wallet,
                timestamp: Date.now()
            });

            closeModal('withdrawFormModal');
            alert('تم إرسال طلب السحب للأدمن.');
        }

        // --- 3. لوحة الأدمن: الاستماع الفوري للطلبات القادمة من أي متصفح في العالم ---
        function listenToLiveAdminRequests() {
            // الاستماع للإيداعات المباشرة
            db.ref('pending_deposits').on('value', snapshot => {
                const container = document.getElementById('adminDepositsList');
                container.innerHTML = '';
                const data = snapshot.val();
                if (!data) {
                    container.innerHTML = '<p style="font-size:0.75rem; color:var(--text-sec)">لا توجد طلبات معلقة</p>';
                    return;
                }
                Object.values(data).forEach(dep => {
                    container.innerHTML += `
                        <div style="background:#121824; border:1px solid var(--border); padding:8px; border-radius:6px; display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <div style="font-size:0.7rem; color:var(--accent);">${dep.email}</div>
                                <div style="font-size:0.8rem; font-weight:bold;">${dep.amount} USDT</div>
                            </div>
                            <div style="display:flex; gap:4px;">
                                <button class="btn btn-success" style="padding:2px 6px; font-size:0.65rem;" onclick="approveDeposit('${dep.id}', '${dep.email}', ${dep.amount})">قبول</button>
                                <button class="btn btn-danger" style="padding:2px 6px; font-size:0.65rem;" onclick="rejectDeposit('${dep.id}')">رفض</button>
                            </div>
                        </div>`;
                });
            });

            // الاستماع للسحوبات المباشرة
            db.ref('pending_withdrawals').on('value', snapshot => {
                const container = document.getElementById('adminWithdrawalsList');
                container.innerHTML = '';
                const data = snapshot.val();
                if (!data) {
                    container.innerHTML = '<p style="font-size:0.75rem; color:var(--text-sec)">لا توجد طلبات سحب معلقة</p>';
                    return;
                }
                Object.values(data).forEach(wd => {
                    container.innerHTML += `
                        <div style="background:#121824; border:1px solid var(--border); padding:8px; border-radius:6px; display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <div style="font-size:0.7rem; color:var(--red);">${wd.email}</div>
                                <div style="font-size:0.8rem; font-weight:bold;">${wd.amount} USDT</div>
                            </div>
                            <div style="display:flex; gap:4px;">
                                <button class="btn btn-success" style="padding:2px 6px; font-size:0.65rem;" onclick="rejectWithdrawal('${wd.id}')">موافقة</button>
                                <button class="btn btn-danger" style="padding:2px 6px; font-size:0.65rem;" onclick="rejectWithdrawal('${wd.id}')">رفض</button>
                            </div>
                        </div>`;
                });
            });
        }

        // --- 4. إجراءات قبول/رفض الأدمن للطلبات (تتحدث آلياً لدى المستخدم) ---
        function approveDeposit(reqId, userEmail, amount) {
            const userKey = cleanEmail(userEmail);
            db.ref('users/' + userKey + '/balance').transaction(currentBalance => {
                return (currentBalance || 0) + amount;
            });
            db.ref('pending_deposits/' + reqId).remove();
            alert('تم إضافة المبلغ لرصيد المستخدم بنجاح!');
        }

        function rejectDeposit(reqId) {
            db.ref('pending_deposits/' + reqId).remove();
        }

        function rejectWithdrawal(reqId) {
            db.ref('pending_withdrawals/' + reqId).remove();
        }

        function openAdminPanel() { openModal('adminPanelModal'); }

        window.onload = function() {
            if (currentUserEmail) showAppScreen();
        };
    </script>
</body>
</html>
